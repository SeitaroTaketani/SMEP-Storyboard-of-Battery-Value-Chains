@media (forced-colors: active) { .mhit:focus-visible { outline: 2px solid CanvasText; } }

<script>
(() => {
  "use strict";
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("c");

  const capEl = document.getElementById("cap");
  const sourceEl = document.getElementById("source");
  const navEl = document.getElementById("nav");
  const bBack = document.getElementById("bBack"), bMap = document.getElementById("bMap"), bNext = document.getElementById("bNext");
  const nextLabel = document.getElementById("nextLabel"), stepEl = document.getElementById("step"), liveEl = document.getElementById("live");
  const progEl = document.getElementById("prog");
  const errEl = document.getElementById("err");
  const mapNav = document.getElementById("mapNav"), mapHint = document.getElementById("mapHint");
  const coverLink = document.getElementById("coverLink");
  // v8.5: make sure phones lay the page out at the device width (if the host page has not said so already)
  try { if (!document.querySelector('meta[name="viewport"]')) { const m = document.createElement("meta"); m.name = "viewport"; m.content = "width=device-width, initial-scale=1, viewport-fit=cover"; document.head.appendChild(m); } } catch (e) { /* no head: nothing to do */ }
  if (!window.gsap) { errEl.hidden = false; capEl.hidden = true; document.getElementById("bottom").hidden = true; return; }

  /* ======================= captions: every figure from the brief, with its page ======================= */
  // v7: eyebrows name the map stop the scene belongs to (spec 3.1); the wording, figures and page references are unchanged
  const S2 = "On the road", S2b = "After the battery dies", S3 = "The lithium-ion option", S5 = "What can change";
  const BEATS = {
    title: { eyebrow: "UNCTAD · SMEP · December 2026", title: "Battery value chains", text: "The challenges for e-mobility in South Asia", dur: 5.0 },
    b1:  { eyebrow: "Transport and energy poverty", big: "34%", text: "of urban residents in Central and Southern Asia had convenient access to public transport in 2019.", ref: "Brief, p. 1, Figure 1", dur: 5.8 },
    b2:  { eyebrow: "Lead-acid battery vehicles", big: "4 million", text: "electric rickshaws in Bangladesh as of 2022 (estimate): low-cost, informal transport for short trips.", ref: "Brief, pp. 1–2", dur: 6.6 },
    b3:  { eyebrow: S2, text: "Each needs 4–6 lead-acid batteries of at least 12 V. Together they can weigh up to 120 kg per vehicle.", ref: "Brief, p. 2", dur: 5.8 },
    b4:  { eyebrow: S2, text: "Formally banned in 2021 over safety concerns, most are unauthorized and unlicensed, yet remain widespread.", ref: "Brief, p. 2", dur: 5.6 },
    b5:  { eyebrow: S2, text: "The batteries are recharged at night, usually in collective garage stalls.", ref: "Brief, p. 2", dur: 5.0 },
    b6:  { eyebrow: S2, text: "A new battery recharges in 8 hours. After about a year, a full charge takes 10–12 hours.", ref: "Brief, p. 2", dur: 5.6 },
    b7:  { eyebrow: S2, big: "2 years", text: "is the lifespan of a lead-acid battery; some last as little as 6 months. Constant renewal means a constant flow of hazardous waste.", ref: "Brief, p. 2", dur: 6.4 },
    b9:  { eyebrow: S2b, big: "80%", text: "of lead-acid batteries in Bangladesh are recycled informally (estimate).", ref: "Brief, p. 3", dur: 5.2 },
    b10: { eyebrow: S2b, text: "Of about 1,100 recycling sites, only 6 are formal. Open-pit smelters, called bhattis, employ around 100,000 people.", ref: "Brief, p. 3", dur: 6.2 },
    // v8: two scenes from the brief's p. 3 (the owner's wording)
    // v9 (health review): the brief's own order and wording; b11w keeps to what the brief says about the place
    b10w:{ eyebrow: S2b, text: "Handling used batteries safely requires extensive protective equipment, yet informal recyclers lack adequate equipment or safety. Lead can act as a neurotoxin in the body, and sulfuric acid in batteries creates skin lesions.", ref: "Brief, p. 3", dur: 7.0 },
    b11w:{ eyebrow: S2b, text: "The toxins can be spread through both air and water, polluting nearby areas. Informal, unsafe recycling contaminates soil and water, at significant costs to public health.", ref: "Brief, p. 3", dur: 7.0 },
    b11: { eyebrow: S2b, big: "15–20%", text: "of the lead recycled in informal shops is released back into the environment (estimate).", ref: "Brief, p. 3", dur: 5.6 },
    b12: { eyebrow: S2b, big: "1 in 5", text: "people in Bangladesh live within 5 km of an informal smelting site (estimate).", ref: "Brief, p. 3", dur: 5.4 },
    b13: { eyebrow: S2b, big: "35 million", text: "children in Bangladesh have elevated lead levels in their blood (approximate). Living close to smelting sites and the lack of child labour enforcement may explain this.", ref: "Brief, p. 3", dur: 5.2 },
    b14: { eyebrow: S2b, big: "$15.9 billion", text: "estimated GDP loss in Bangladesh from IQ loss caused by children’s lead exposure.", ref: "Brief, p. 3", dur: 5.6 },
    b15: { eyebrow: S2b, text: "Where formal facilities and reverse supply chains handle them, recycling rates are as high as 99% in the United States; in the EU, 97% of collectable batteries are recycled.", ref: "Brief, p. 3", dur: 7.0 },
    b16: { eyebrow: S3, big: "Up to 6×", text: "higher energy density for lithium-ion than for lead-acid.", ref: "Brief, p. 6", dur: 5.0 },
    b17: { eyebrow: S3, text: "Lithium-ion can use 80–90% of its capacity, against 30–40% for lead-acid, and its lifecycle is double.", ref: "Brief, p. 6, Figure 4", dur: 5.8 },
    b18: { eyebrow: S3, text: "But it costs about $150/kWh to produce, against $60/kWh for lead-acid.", ref: "Brief, p. 6", dur: 5.6 },
    b19a:{ eyebrow: S3, big: "75%", text: "of lithium-ion production costs come from materials (approximate).", ref: "Brief, p. 7", dur: 4.8 },
    b19b:{ eyebrow: S3, text: "Mining of these minerals is concentrated in a few economies.", ref: "Brief, pp. 7–8, Table 1", dur: 5.8 },
    b20: { eyebrow: S3, big: "Over 90%", text: "of lithium-ion battery production is concentrated in China.", ref: "Brief, p. 8", dur: 5.0 },
    b21: { eyebrow: S3, text: "South Asia’s battery trade for mobility reached $3.7 billion in 2023, 90% of it lithium-ion. The region is a net exporter of lead-acid batteries.", ref: "Brief, p. 8", dur: 6.8 },
    b22: { eyebrow: S3, text: "For lithium-ion, imports were 96% of trade in 2023. The deficit grew from $0.2 billion in 2013 to $3 billion in 2023.", ref: "Brief, p. 8, Figure 5", dur: 6.4 },
    b23: { eyebrow: S5, text: "Progress is held back by the lack of a coherent approach across ministries for road transport, hazardous waste, imports and exports.", ref: "Brief, p. 9", dur: 6.4 },
    b24: { eyebrow: S5, text: "Make recycling safer: formalize the three-wheeler sector, tag and trace batteries, incentivize their collection, and keep pregnant women and children out of the work.", ref: "Brief, p. 9", dur: 6.6 },
    b25: { eyebrow: S5, text: "Raise the quality of domestic and imported batteries, so they last longer and need recycling less often.", ref: "Brief, p. 9", dur: 5.6 },
    b26: { eyebrow: S5, text: "Support the shift to lithium-ion over time: subsidies, lower tariffs on battery components, loans and microfinance.", ref: "Brief, p. 9", dur: 6.0 },
    b27: { eyebrow: S5, text: "Avoid import tariffs on batteries and export taxes on lead: decoupling local from world prices spurs informality.", ref: "Brief, p. 9", dur: 6.0 },
    b28: { eyebrow: S5, text: "Circular options include deposit refunds, take-back programmes, longer warranties and battery swapping; solar charging stations could also help.", ref: "Brief, p. 9", dur: 7.2 },
    end: { eyebrow: "UNCTAD · SMEP · December 2026", title: "Battery value chains", text: "The challenges for e-mobility in South Asia",
      note: "Every figure in this story comes from this brief.", noteTall: "Page numbers refer to it.", cta: "Read the full brief", ctaNote: "PDF on unctad.org, opens in a new tab", dur: 4.4 },
  };
  // v7: the canvas describes the current scene to screen readers (spec section 2)
  const ALT = {
    title: "A lead-acid battery standing in water.",
    b1: "Bar chart: share of urban residents with convenient access to public transport in 2019, by region; Central and Southern Asia 34%.",
    b2: "An electric rickshaw with its batteries under the passenger seat.",
    b3: "Four to six batteries in a row above a weight marked up to 120 kg.",
    b4: "A regulation stamped banned 2021, a crossed-out licence and three rickshaws still driving.",
    b5: "At night, a rack of chargers in a garage, with cables running to a battery and a parked rickshaw.",
    b6: "Two clocks: a new battery charges in 8 hours; after about a year it takes 10 to 12 hours.",
    b7: "Timeline: a lead-acid battery lasts about 2 years, some only 6 months, then becomes hazardous waste.",
    b9: "Ten used batteries; eight of them go to informal recycling.",
    b10: "A grid of about 1,100 recycling sites; only 6 are formal.",
    b10w: "A worker without protective equipment breaks open a used battery with a hammer. Grey lead paste covers his fingertips; acid drips onto the ground. A close-up shows his bare hand.",
    b11: "An open-pit smelter melting old batteries; lead escapes into the air, soil and water.",
    // v10: the ALT texts say what is drawn
    b11w: "A red shed and a grey factory wall with a smoking stack stand above a mud bank and a pond. A pipe on the bank lets out grey run-off in pulses; it runs down a channel, clouds the water and settles into the mud under the pond. Five children play on the bank and in the water.",
    b12: "The same site, seen small, beside five houses. A dashed ring on the ground marks 5 km around the site; the nearest house, inside the ring, is highlighted. The other four stand outside it.",
    b13: "A child stands calmly. A magnifying circle on the child's arm shows blood: red cells in pale fluid, with a few small grey particles labelled lead (Pb).",
    b14: "A banknote and a coin. Beside them, an open book with a pencil and a turning gear send coins into a jar; coins slip out through a crack in the jar and fall down an arrow labelled GDP loss onto a small pile.",
    b15: "A formal recycling plant; recycling rates reach 99% in the United States and 97% in the EU.",
    b16: "Two batteries of the same size: lithium-ion holds up to six times the energy.",
    b17: "Lead-acid can use 30 to 40% of its capacity, lithium-ion 80 to 90%; lithium-ion lasts twice as many cycles.",
    b18: "Coin stacks: lithium-ion costs about $150 per kWh to produce, lead-acid about $60.",
    b19a: "About three quarters of lithium-ion production cost is materials.",
    b19b: "Five battery minerals and the largest mining economy for each, with its share of world output.",
    b20: "A factory in China; over 90% of lithium-ion batteries are made there.",
    b21: "South Asia's battery trade in 2023 was $3.7 billion, 90% lithium-ion; it exports more lead-acid batteries than it imports.",
    b22: "South Asia's lithium-ion trade deficit grew from $0.2 billion in 2013 to $3 billion in 2023; imports were 96% of trade.",
    b23: "Four policy areas, each its own picture and not connected: a rickshaw on a road (road transport), a drum with a warning sign beside spent batteries (hazardous waste), a container ship coming in to port (imports) and one leaving port (exports). In the middle, four jigsaw pieces in the same colours push together but cannot fit.",

    b25: "Two lead-acid batteries. A cheaply made one, with a crooked lid, dull terminals and bulging sides, wears out early: its terminals crust over, it cracks and leaks acid. A well-made one keeps going; its life bar is much longer.",
    b26: "Subsidies, lower tariffs on components and loans all support lithium-ion batteries.",
    b27: "Diagram: tariffs and export taxes push local prices above world prices, which feeds informal recycling.",
    b28: "A loop of circular options: deposit refunds, take-back, longer warranties, battery swapping and solar charging.",
    end: "The cover of the brief: a hen standing on a battery charger. The battery from the story lands on the charger and the cover photo opens around it.",
  };
  // v5 merge: on-screen time follows reading load (about 3.2 words per second, plus 1.6 s to settle)

  // v10: the b11w site in its own coordinates (bank, pond, mud, run-off channel), shared by b11w and its miniature in b12
  const SITE = (() => {
    const SH = [[-318, 26], [-240, 28], [-150, 33], [-60, 41], [30, 50], [120, 60], [210, 70], [322, 84]], WB = 176;
    const TOP = [[-322, 26], [-306, -48], [-294, -62]]; for (let x = -270; x <= 280; x += 30) TOP.push([x, -64 + 3 * Math.sin(x * 0.03) + 2 * Math.sin(x * 0.11)]); TOP.push([298, -60], [314, -40], [326, 84]);
    const ENDS = [...catmull([[322, 84], [316, 140], [300, WB]], 6), [-292, WB], ...catmull([[-292, WB], [-310, 110], [-318, 26]], 6)];
    const MUDB = [[-292, WB], [300, WB], ...earc(284, WB + 26, 16, 16, 0, Math.PI / 2, 6), ...earc(-276, WB + 26, 16, 16, Math.PI / 2, Math.PI, 6)];
    const CHAN = [[-262, -56], [-246, -56], [-182, 28], [-202, 30]], RUN = [[-253, -58], [-222, -16], [-194, 24], [-176, 36]];
    const TREES = [[-96, -162, 38, 71], [280, -176, 44, 81]];
    return { SH, TOP, WB, ENDS, MUDB, CHAN, RUN, TREES, BOX: [-326, -220, 330, 218] };
  })();
  // a box in world units from two local corners (the move's scale is taken from it, see uBox)
  const boxW = (x0, y0, x1, y1) => { const a = W(x0, y0), b = W(x1, y1); return { x0: a[0], y0: a[1], x1: b[0], y1: b[1] }; };
  /* ======================= the 30 slides ======================= */
  // s.unit.<name> lists the groups that a move can carry into the next scene (see PAIRS below). TALL is true when the
  // stage is taller than wide: some labels then wrap or move so that they stay legible at the 12–14 px phone sizes.
  function buildSlides() {
  slide("title", "teal", [40, 0, 1.0], s => {
    at(0.35); s.unit.bat = [battery(60, -20, 200, 150, { float: { amp: 5, sp: 0.9 } })];
    at(1.0); waves(-60, 50, 300);
    at(1.4); pix(4, [-230, -170, 260, 170], [PAL.grey, PAL.greyL, PAL.blue, PAL.mint], { min: 10, max: 22, step: 0.08 });
  });

  slide("b1", "white", [0, 0, 1.05], s => {
    const D = [["Australia / New Zealand", 83], ["Europe / Northern America", 75], ["Latin America / Caribbean", 50], ["Eastern / South-Eastern Asia", 38], ["Central / Southern Asia", 34], ["Sub-Saharan Africa", 33], ["Northern / Western Asia", 33]];
    if (!TALL) {
      const X0 = -70, SC = 3.2;
      at(0.1); txt("Urban population with convenient access to public transport, 2019 (%)", -260, -196, { align: "left", c: PAL.greyD, size: 12, tier: 3 });
      grp({ type: "none" }, () => {
        lin([[X0, -172], [X0, 180]], DT, { w: 1.5, dur: 0.7 });
        [0, 20, 40, 60, 80, 100].forEach((v, k) => { lin([[X0 + v * SC, 180], [X0 + v * SC, -172]], PAL.greyL, { w: 1, at: 0.1 + k * 0.05, dur: 0.7 }); txt(String(v), X0 + v * SC, 198, { size: 11, c: PAL.greyD, tier: 3, at: 0.3 + k * 0.05 }); });
      });
      at(0.45);
      D.forEach(([name, v], i) => {
        const y = -150 + i * 48, hi = name.startsWith("Central");
        grp({ type: "rise", dy: 14, step: 0.1 }, () => {
          txt(name, X0 - 12, y + 12, { align: "right", size: 12, tier: 3, weight: hi ? 600 : 500, c: hi ? PAL.purple : DT });
          shp(rc(X0, y, v * SC, 24), hi ? PAL.orange : PAL.sky, { fill2: hi ? PAL.yellow : PAL.skyL, horiz: true, wipe: "right", at: 0.05, dur: 1.0 });
          txt(String(v), X0 + v * SC + 18, y + 12, { size: 13, weight: 600, tier: 2, c: hi ? PAL.orangeD : DT, at: 0.8 });
        });
      });
    } else {
      // phone (spec 3.4): names above their bars, two-line chart title
      const X0 = -250, SC = 4.9, P = 60;
      at(0.1); grp({ type: "rise", dy: 10 }, () => { txt("Urban population with convenient access", X0, -246, { align: "left", c: PAL.greyD, size: 12, tier: 3 }); txt("to public transport, 2019 (%)", X0, -222, { align: "left", c: PAL.greyD, size: 12, tier: 3 }); });
      grp({ type: "none" }, () => {
        lin([[X0, -196], [X0, 226]], DT, { w: 1.5, dur: 0.7 });
        [0, 20, 40, 60, 80, 100].forEach((v, k) => { lin([[X0 + v * SC, 226], [X0 + v * SC, -196]], PAL.greyL, { w: 1, at: 0.1 + k * 0.05, dur: 0.7 }); txt(String(v), X0 + v * SC, 246, { size: 11, c: PAL.greyD, tier: 3, at: 0.3 + k * 0.05 }); });
      });
      at(0.45);
      D.forEach(([name, v], i) => {
        const y = -170 + i * P, hi = name.startsWith("Central");
        grp({ type: "rise", dy: 14, step: 0.1 }, () => {
          txt(name, X0 + 6, y - 2, { align: "left", size: 12, tier: 3, weight: hi ? 600 : 500, c: hi ? PAL.purple : DT });
          shp(rc(X0, y + 10, v * SC, 24), hi ? PAL.orange : PAL.sky, { fill2: hi ? PAL.yellow : PAL.skyL, horiz: true, wipe: "right", at: 0.05, dur: 1.0 });
          txt(String(v), X0 + v * SC + 10, y + 22, { align: "left", size: 13, weight: 600, tier: 2, c: hi ? PAL.orangeD : DT, at: 0.8 });
        });
      });
    }
  });

  slide("b2", "white", [-10, -30, 1.12], s => {
    // the hand sketches first; colour then paints into the sketch (owner's decision: the pen hand stays)
    // v8: the strokes trace the new outline (rickOutline: roof and windscreen, body and floor, the seats, the two wheels)
    rickOutline().forEach(p => pen(p.map(([x, y]) => [x, y + 90]), DT, { poly: true, w: 2.2 }));
    at(2.7); s.rick = rickshaw(0, 90, 1, { paint: true, noGround: true }); s.unit.rick = [s.rick];
    grp({ type: "none", at: 2.7 }, () => { lin([[-270, 90], [270, 90]], DT, { w: 1.8, at: 0.1 }); lin([[-214, 102], [-104, 102]], DT, { w: 1.8, at: 0.3 }); lin([[214, 90], [214, 97]], DT, { w: 1.5, at: 0.5 }); lin([[220, 90], [220, 97]], DT, { w: 1.5, at: 0.55 }); });
    at(4.4); bolt(-60, -205, 1.4);
  });

  slide("b3", "blue", [0, 0, 1.05], s => {
    at(0.2);
    // v8.4: on phones the six batteries stand in two rows of three, so they can be drawn larger
    for (let k = 0; k < 6; k++) s.unit["bat" + k] = [battery(TALL ? -110 + (k % 3) * 110 : -250 + k * 100, TALL ? -150 + Math.floor(k / 3) * 100 : -40, 70, 56, { alpha: k < 4 ? 1 : 0.42, simple: true, step: 0.1, float: { amp: 2, sp: 1.2 } })];
    at(1.0);
    const bx = TALL ? 160 : 290, by = TALL ? -222 : -110;
    grp({ type: "none" }, () => { lin([[-bx, by], [-bx, by - 10], [bx, by - 10], [bx, by]], PAL.purple, { w: 1.8, dur: 0.9 }); txt("4–6 batteries of at least 12 V per vehicle", 0, by - 30, { size: 13, weight: 600, c: PAL.purple, at: 0.5 }); });
    at(1.8); grp({ type: "thud", dy: -260, dur: 0.75 }, () => {
      shp([[-70, 170], [-50, 70], [50, 70], [70, 170]], PAL.navy, { fill2: "#33407A" });
      shp(rr(-24, 46, 48, 30, 12), PAL.navy); shp(rr(-12, 54, 24, 14, 6), PAL.blue, { shade: false });
      txt("up to", 0, 102, { size: 12, c: PAL.skyL, tier: 3 }); txt("120 kg", 0, 134, { size: 20, weight: 600, c: PAL.creamL, tier: 1 });
